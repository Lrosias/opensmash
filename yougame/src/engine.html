<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSmash64 arena</title><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}body{display:grid;place-items:center}
canvas{width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,calc(100vw * 3 / 4));outline:none;touch-action:none}
#status{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ddd;background:#000;font:14px Arial,sans-serif;text-align:center}
#status[hidden]{display:none}.loading-progress{width:160px;height:3px;border:0;accent-color:#ddd}.loading-progress::-webkit-progress-bar{background:#333}.loading-progress::-webkit-progress-value{background:#ddd}
</style></head><body><canvas id="canvas" tabindex="0"></canvas><section id="status" role="status" aria-live="polite">
<div id="loading-caption">Loading…</div>
<progress class="loading-progress" id="loading-progress" max="1" value="0" aria-label="Loading game assets"></progress>
</section>
<script type="module">
import {loadPageComparator} from '../page-compare.mjs';
import {startOfflineClock} from '../frame-clock.mjs';
import {createAudioOutput,muteEngineOutput} from '../audio-output.mjs';
const status = document.querySelector('#status');
const caption=document.querySelector('#loading-caption'),progress=document.querySelector('#loading-progress');
const params = new URLSearchParams(location.search);
const bridge = parent.openSmashAttachEngine(window);
const rollback=params.has('SSB64_YOUGAME_ROLLBACK');
const muted=params.get('SSB64_YOUGAME_MUTE')==='1';
if(muted)muteEngineOutput(window);
window.__runHidden = rollback;
let stopClock,disposed=false;
window.Module = {
  canvas:document.querySelector('canvas'), arguments:[],
  yougameMenu:bridge.menuState(),
  onYouGameMenu:(...args) => bridge.menuAction(...args),
  beforeGameTick:() => bridge.beforeTick(),
  onYouGameState:(...args) => bridge.afterTick(...args),
  readPorts:(ptr) => bridge.readPorts(ptr, HEAP32),
  print:() => {}, printErr:t => console.warn(t),
  onAbort:e => bridge.error(String(e)),
  async onRuntimeInitialized() {
    caption.textContent='Loading…';
    try {
        Module.callMain([]);
        if(Asyncify.currData)await Asyncify.whenDone();
        const comparator=rollback?await loadPageComparator({memory:wasmMemory,allocate:_malloc,free:typeof _free==='function'?_free:null}):null;
        const driver={
          comparePage:comparator?.samePage,mirror:comparator?.mirror,
          silence(value){Module.yougameReplay=value;if(value)Module._port_yougame_audio_rewind();},
          rollback(){Module._port_yougame_audio_rewind();Module.yougameReplay=true;queueMicrotask(()=>{Module.yougameReplay=false;});},
          step(){Module._PortPushFrame();if(Asyncify.currData)throw new Error('Native frame did not complete synchronously');},
          memory:()=>HEAPU8,used:()=>Module._port_heap_used(),heapBase:()=>Module._port_yougame_heap_base(),
          exclusions(){
            const p=Module._port_yougame_stack_exclusions()>>2,n=HEAPU32[p];
            const ranges=Module.yougameTextureScratch?[Module.yougameTextureScratch]:[];
            if(comparator)ranges.push(...comparator.ranges());
            const scene=Module._port_yougame_scene_unused()>>2;ranges.push([HEAPU32[scene],HEAPU32[scene+1]]);
            for(let i=1;i<=n;i+=2)ranges.push([HEAPU32[p+i],HEAPU32[p+i+1]]);
            return ranges;
          }
        };
        await bridge.ready(driver);
        status.hidden = true;
        if(!rollback)stopClock=startOfflineClock(driver.step,{onError:e=>bridge.error(e.message)});
    } catch(e){bridge.error(e.message);}
  },
  preRun:[function() {
    addRunDependency('yougame-assets');
    ENV.SDL_EMSCRIPTEN_ASYNCIFY='0';
    if(!rollback)ENV.SSB64_YOUGAME_MANUAL='1';
    for (const [k,v] of params) if (k.startsWith('SSB64_')) ENV[k] = v;
    (async() => {
      let done = 0;const weights=manifest.files.map(f=>Number.isFinite(f.size)&&f.size>0?f.size:1),total=weights.reduce((a,b)=>a+b,0);
      await Promise.all(manifest.files.map(async (file,index) => {
        const response = await fetch(file.url); if (!response.ok) throw new Error(`Missing engine asset: ${file.url}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        FS.mkdirTree(file.path.substring(0,file.path.lastIndexOf('/')) || '/'); FS.writeFile(file.path,bytes);
        done+=weights[index];progress.value=total?done/total:1;
      }));
      if(archive){const {writeArchive}=await import('./rom-extract.mjs');writeArchive(FS,archive.bytes,archive.extras);}
    })().then(() => removeRunDependency('yougame-assets')).catch(e => {caption.textContent=e.message; bridge.error(e.message);});
  }]
};
function audioContext(){return Module.yougameAudio?.context||Module.SDL2?.audioContext;}
for(const event of ['pointerdown','keydown'])window.addEventListener(event,()=>{if(!document.hidden)audioContext()?.resume().catch(()=>{});},{capture:true});
document.addEventListener('visibilitychange',()=>{
 if(rollback)return;
 const context=audioContext();
 if(document.hidden){Module.yougameAudio?.flush();context?.suspend().catch(()=>{});}
 else context?.resume().catch(()=>{});
});
Module.yougameDispose=()=>{disposed=true;stopClock?.();if(Module.yougameAudio)Module.yougameAudio.close();else audioContext()?.close().catch(()=>{});};
window.addEventListener('pagehide',Module.yougameDispose,{once:true});
let manifest,archive=null;
try {
  Module.yougameAudio=params.get('SSB64_YOUGAME_AUDIO')==='SDL'?null:await createAudioOutput({muted});
  if(disposed){Module.yougameAudio?.close();throw new Error("Engine closed during loading");}
  const response = await fetch('./manifest.json'); if (!response.ok) throw new Error('Engine build is missing');
  manifest = await response.json();
  if(!manifest.files.some(f=>f.path === '/BattleShip.o2r')){
    // A YouGame patch listing (package-kosher.mjs): the game assets come from the player's own ROM
    // (YouGame.baseGame() on the site page, this frame's parent), built by Torch in the browser and
    // cached per ROM (rom-extract.mjs). Direct-play packages ship the archive and skip this.
    const recipeEntry=manifest.files.find(f=>f.path==='/BattleShip.o2r.recipe');
    const recipe=recipeEntry?(await (await fetch(recipeEntry.url)).text()).trim():'unknown';
    const {ensureArchive}=await import('./rom-extract.mjs');
    archive=await ensureArchive({recipe,getRom:()=>parent.YouGame.baseGame(),setStatus:t=>{caption.textContent=t;}});
    if(disposed)throw new Error("Engine closed during loading");
  }
  const script=document.createElement('script');script.src='./BattleShip.js';script.onerror=()=>bridge.error('Could not load engine');document.body.append(script);
} catch(e) {caption.textContent=e.message;bridge.error(e.message);}
</script></body></html>
