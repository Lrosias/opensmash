<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenSmash arena</title><style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}body{display:grid;place-items:center}
canvas{width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,calc(100vw * 3 / 4));outline:none;touch-action:none}
#status{position:fixed;bottom:12px;color:#fff;font:14px system-ui;padding:8px;background:#000c0}
</style></head><body><canvas id="canvas" tabindex="0"></canvas><div id="status" role="status">Loading arena…</div>
<script type="module">
const status = document.querySelector('#status');
const params = new URLSearchParams(location.search);
const bridge = parent.openSmashAttachEngine(window);
window.__runHidden = true;
window.Module = {
  canvas:document.querySelector('canvas'), arguments:[],
  yougameMenu:bridge.menuState(),
  onYouGameMenu:(...args) => bridge.menuAction(...args),
  beforeGameTick:() => bridge.beforeTick(),
  onYouGameState:(...args) => bridge.afterTick(...args),
  readPorts:(ptr) => bridge.readPorts(ptr, HEAP32),
  print:() => {}, printErr:t => console.warn(t),
  onAbort:e => bridge.error(String(e)),
  async onRuntimeInitialized() {
    status.hidden = true;
    if (params.has('SSB64_YOUGAME_ROLLBACK')) {
      try {
        Module.callMain([]);
        if(Asyncify.currData)await Asyncify.whenDone();
        bridge.ready({
          silence(value){Module.yougameReplay=value;if(value)Module._port_yougame_audio_rewind();},
          rollback(){Module._port_yougame_audio_rewind();Module.yougameReplay=true;queueMicrotask(()=>{Module.yougameReplay=false;});},
          step(){Module._PortPushFrame();if(Asyncify.currData)throw new Error('Native frame did not complete synchronously');},
          memory:()=>HEAPU8,used:()=>Module._port_heap_used(),heapBase:()=>Module._port_yougame_heap_base(),
          exclusions(){
            const p=Module._port_yougame_stack_exclusions()>>2,n=HEAPU32[p];
            const ranges=Module.yougameTextureScratch?[Module.yougameTextureScratch]:[];
            const scene=Module._port_yougame_scene_unused()>>2;ranges.push([HEAPU32[scene],HEAPU32[scene+1]]);
            for(let i=1;i<=n;i+=2)ranges.push([HEAPU32[p+i],HEAPU32[p+i+1]]);
            return ranges;
          }
        });
      } catch(e){bridge.error(e.message);}

    } else { bridge.ready(); Module.callMain([]); }
  },
  preRun:[function() {
    addRunDependency('yougame-assets');
    if(params.has('SSB64_YOUGAME_ROLLBACK'))ENV.SDL_EMSCRIPTEN_ASYNCIFY='0';
    for (const [k,v] of params) if (k.startsWith('SSB64_')) ENV[k] = v;
    (async() => {
      let done = 0;
      await Promise.all(manifest.files.map(async file => {
        const response = await fetch(file.url); if (!response.ok) throw new Error(`Missing engine asset: ${file.url}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        FS.mkdirTree(file.path.substring(0,file.path.lastIndexOf('/')) || '/'); FS.writeFile(file.path,bytes);
        status.textContent = `Loading arena… ${++done}/${manifest.files.length}`;
      }));
    })().then(() => removeRunDependency('yougame-assets')).catch(e => {status.textContent=e.message; bridge.error(e.message);});
  }]
};
let manifest;
try {
  const response = await fetch('./manifest.json'); if (!response.ok) throw new Error('Engine build is missing');
  manifest = await response.json();
  if (!manifest.files.some(f=>f.path === '/BattleShip.o2r')) throw new Error('This build is missing its game assets.');
  const script=document.createElement('script');script.src='./BattleShip.js';script.onerror=()=>bridge.error('Could not load engine');document.body.append(script);
} catch(e) {status.textContent=e.message;bridge.error(e.message);}
</script></body></html>
