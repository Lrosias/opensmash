<!doctype html><meta charset="utf-8"><title>OpenSmash rollback verification</title>
<style>body{background:#151821;color:white;font:15px monospace}iframe{width:640px;height:480px;border:0}button{padding:16px}pre{white-space:pre-wrap}</style>
<button id="run" disabled>Test native rewind and replay</button><pre id="report">Loading engine…</pre><div id="game"></div>
<script type="module">
import {NativeCheckpoints} from '../src/checkpoints.mjs';
let engine,state,pads=[[0,0,0],[0,0,0]];
window.openSmashAttachEngine=()=>({menuState:()=>({phase:0}),menuAction(){},ready(driver){engine=driver;run.disabled=false;report.textContent='Ready';},beforeTick:()=>true,afterTick(...s){state=s;},error(e){if(!report.textContent.includes('FAIL'))report.textContent+='\nENGINE ERROR: '+String(e);},readPorts(ptr,H){for(let i=0;i<4;i++){const b=(ptr>>2)+i*4,p=pads[i];H[b]=p?2:1;H[b+1]=p?.[0]||0;H[b+2]=p?.[1]||0;H[b+3]=p?.[2]||0;}}});
const frame=document.createElement('iframe');frame.src='../dist/engine/index.html?SSB64_YOUGAME=1&SSB64_YOUGAME_ROLLBACK=1&SSB64_BOOT_BATTLE=0,8,6,0&SSB64_BOOT_HUMANS=2&SSB64_BOOT_SLOTS=hhoo&SSB64_STOCKS=3&SSB64_VS_INTRO=0';game.append(frame);
run.onclick=async()=>{
 run.disabled=true;const log=[];const say=s=>{log.push(s);report.textContent=log.join('\n');};
 try{
  for(let i=0;i<600&&!(state?.[4]>=30);i++)engine.step();
  say('Warmup: '+JSON.stringify(state));if(!state?.[4])throw new Error('Battle has not started');
  const store=new NativeCheckpoints(engine,{window:64});const times=[];const t0=performance.now();const saved=store.save(0,state);say('Snapshot bytes: '+engine.used()+'; heap base: '+engine.heapBase()+'; first save ms: '+(performance.now()-t0).toFixed(1));
  say('Captured live pages MB: '+(store.pages.filter(Boolean).length*store.pageBytes/1048576).toFixed(1));const expected=[];for(let i=0;i<60;i++){pads=[[i%10<5?32768:8,i<30?60:-60,0],[16384,0,0]];engine.step();expected.push([...state]);const t=performance.now();store.save(i+1,state);times.push(performance.now()-t);}
  say('Mean save ms: '+(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1));state=store.load(saved);
  for(let i=0;i<60;i++){pads=[[i%10<5?32768:8,i<30?60:-60,0],[16384,0,0]];engine.step();if(JSON.stringify(state)!==JSON.stringify(expected[i]))throw new Error('Replay differs at '+i+': '+JSON.stringify(state)+' expected '+JSON.stringify(expected[i]));}
  say('PASS: 60 replayed frames match exactly');
 }catch(e){say('FAIL: '+e.stack);}finally{run.disabled=false;}
};
</script>
