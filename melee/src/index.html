<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenSmash Melee</title>
<link rel="stylesheet" href="./style.css">
<body>
  <div id="play-surface">
  <canvas id="canvas" width="640" height="480" aria-label="OpenSmash Melee"></canvas>
  <section id="touch-controls" aria-label="Touch controller">
    <div class="touch-top">
      <button id="touch-reset" data-mask="3105" type="button" tabindex="-1" aria-label="Reset match" title="Pause with Start, then reset the match" hidden>Reset match<span>Pause first</span></button>
      <button id="touch-start" data-mask="32" type="button" tabindex="-1">Start</button><button id="touch-leave" type="button" tabindex="-1" hidden>Hold to leave</button>
    </div>
    <button id="touch-taunt" data-mask="64" type="button" tabindex="-1" aria-label="Taunt">Taunt</button>
    <div id="touch-stick-zone" role="group" aria-label="Control stick">
    <div id="touch-stick" aria-hidden="true"><span class="stick-arrows" aria-hidden="true">＋</span><span id="stick-thumb"></span></div>
    </div>
    <div id="touch-c-zone" role="group" aria-label="C-stick">
    <div id="touch-c" aria-hidden="true"><span class="c-label" aria-hidden="true">C</span><span id="c-thumb"></span></div>
    </div>
    <div class="touch-actions">
      <button class="touch-button jump" data-mask="4" type="button" tabindex="-1" aria-label="Jump (X)"><b>Jump</b></button>
      <button class="touch-button special" data-mask="2" type="button" tabindex="-1" aria-label="B Special or back"><b>B</b><span>Special</span></button>
      <button class="touch-button attack" data-mask="1" type="button" tabindex="-1" aria-label="A Attack or select"><b>A</b><span>Attack</span></button>
      <button class="touch-button shield" data-mask="2048" type="button" tabindex="-1" aria-label="Shield (R)"><b>Shield</b></button>
      <button class="touch-button grab" data-mask="16" type="button" tabindex="-1" aria-label="Grab (Z)"><b>Grab</b></button>
    </div>
  </section>
  <aside id="download-status" hidden aria-label="Game downloads"><span id="download-icon" aria-hidden="true"></span><span id="download-label" role="status" aria-live="polite"></span><span id="download-detail"></span><button id="download-retry" hidden>Retry</button><i id="download-bar" aria-hidden="true"></i></aside>
  </div>
  <p id="status" role="status" class="sr-only">Loading OpenSmash Melee</p>
  <script src="https://yougame.co/sdk.js"></script>
  <script src="./engine/melee.js"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
